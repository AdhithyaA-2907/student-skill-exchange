<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillSwap Admin Login</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body data-admin-page="login">
  <!-- This document contains only the Admin Login page. -->
  <main class="login-shell">
    <form id="admin-login-form" class="login-card">
      <p class="eyebrow">SKILLSWAP · SUPERVISOR</p>
      <h1>Admin / Supervisor Login</h1>
      <p>Use an administrator account to manage the SkillSwap platform.</p>
      <label>User ID or email<input name="user_id" required maxlength="100" autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <label id="authenticator-field" hidden>Authenticator code<input name="totp_code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"></label>
      <p id="login-error" class="form-error" role="alert"></p>
      <p id="login-success" class="form-success" role="status" hidden>Admin account created successfully. Please sign in.</p>
      <button class="primary" type="submit">Sign In</button>
      <a href="/admin/register">Don't have an Admin account? Create one</a>
      <a href="/">Back to Student Login</a>
    </form>
  </main>
  <script src="/admin/admin.js"></script>
</body>
</html>
